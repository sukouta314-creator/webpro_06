<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>駅を追加する（詳細付き）</title>
</head>
<body>
    <h2>駅を追加する</h2>
    <form action="/keiyo2_add">
        <p><label>ID <input type="number" name="id" required></label></p>
        <p><label>駅コード <input type="text" name="code" required></label></p>
        <p><label>駅名 <input type="text" name="name" required></label></p>
        <p><label>乗り換え線 <input type="text" name="change"></label></p>
        <p><label>乗降客数 <input type="number" name="passengers" required></label></p>
        <p><label>東京駅からの距離(km) <input type="number" step="0.1" name="distance" required></label></p>
        <input type="submit" value="登録">
    </form>
    <a href="/keiyo2">一覧へ</a>
</body>
</html>
